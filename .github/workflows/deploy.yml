# Builds the site and publishes it to GitHub Pages on every push to main.
#
# PREVIEW: served at https://nradachy-web.github.io/wvr-photography/ with
# BASE_PATH set, so every page is noindex and robots.txt closes the site.
# PRODUCTION (after the domain moves, see docs/LAUNCH.md): drop BASE_PATH,
# add public/CNAME and set the custom domain in the repository's Pages settings.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /wvr-photography/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-images-
      - run: npm ci
      - run: npx astro build
      - run: node scripts/postbuild.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
